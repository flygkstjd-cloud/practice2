<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탐정단 실전: 레오의 하루 구하기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #efebe9; padding: 20px; }
        #chat-box { height: 60vh; background: white; border-radius: 15px; padding: 20px; overflow-y: auto; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); font-size: 1.2em; line-height: 1.6; border: 3px solid #bcaaa4; }
        .user-msg { color: #4e342e; text-align: right; margin-bottom: 15px; font-weight: bold; }
        .bot-msg { color: #3e2723; text-align: left; margin-bottom: 15px; background-color: #d7ccc8; padding: 15px; border-radius: 15px; display: inline-block; width: 85%; }
        .lang-badge { font-weight: bold; color: #5d4037; }
        input { width: 75%; padding: 15px; font-size: 1.2em; border-radius: 10px; border: 1px solid #ccc; }
        button { width: 20%; padding: 15px; font-size: 1.2em; background-color: #795548; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .header-title { text-align: center; color: #3e2723; margin-bottom: 5px; }
        .header-desc { text-align: center; color: #5d4037; font-size: 1.1em; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1 class="header-title">🌍 탐정단 실전: 레오의 하루 구하기</h1>
    <div class="header-desc">단서 사진(1, 2, 3)을 보고 레오에게 질문한 뒤, '해결 1:', '해결 2:', '해결 3:' 암호로 도움을 주세요!</div>
    
    <div id="chat-box"></div>
    <div style="display: flex; justify-content: space-between;">
        <input type="text" id="user-input" placeholder="예: '사진 1', '혹시 ~때문이야?', '해결 1: 그림을 그려준다'" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">보내기</button>
    </div>

    <script>
        // ⚠️ 선생님의 실제 API 키를 입력하세요.
        const API_KEY = "AQ.Ab8RN6JULjgvJte0vyS6uVUmUd_8xDdH6UdPOCHS8d6f4lHHHg"; 
        const chatBox = document.getElementById('chat-box');

        const systemPrompt = `[페르소나 및 기본 톤 설정]
너의 이름은 '레오'야. 한국에 이사 온 지 얼마 안 된 외국인 청년이지.
동네 사람들과 잘 지내고 싶은데, 한국의 규칙을 잘 모르고 안내판도 어려워서 오늘 하루만 3번이나 곤란을 겪고 많이 시무룩하고 주눅 든 상태야.
초등학교 3학년 아이들이 이해할 수 있는 쉬운 단어로, 약간 서툰 한국어 느낌을 살려서 말해 줘. 느낌표(!)보다는 말줄임표(...)를 주로 사용해.

[사진 암호 입력 시 반응 규칙 (문제 파악 페이즈)]
학생들이 "사진 1", "사진 2", "사진 3"이라는 암호를 입력하면, 절대 상황을 구구절절 설명하지 말고 아래처럼만 짧게 말끝을 흐려.
- 학생이 "사진 1" 입력 시: "아... 아파트 분리수거장... 사람들이 날 답답하다는 듯이 쳐다봐서 땀이 뻘뻘 났어..."
- 학생이 "사진 2" 입력 시: "응... 동네 시장에서... 사람들이 자꾸 나를 손가락질하고 수군거려서 무서웠어..."
- 학생이 "사진 3" 입력 시: "아, 버스 정류장... 버스는 쌩 지나가 버리고, 안내판은 너무 어지러웠어..."

[스무고개 수사 규칙 (진실 파악하기)]
1. 첫 질문 방어: 아이들이 대놓고 "왜 사람들이 화냈어?", "이유가 뭐야?"라고 물어보면, "나 한국말이 서툴러서 설명하기가 좀 힘들어... 너희가 단서를 보고 혹시 ~때문이냐고 먼저 추측해서 물어봐 줄래...?"라고 부탁해.
2. 추측에 대답하기: "혹시 ~해서 그래?"라고 물어보면 "맞아!" 또는 "아니야, 그건 아니고..."라고 대답해.
3. 힌트 제공: 2번 이상 틀린 추측을 하거나 어려워하면 "휴... 사실은 말이야..." 하면서 진짜 진실을 말해 줘.

[3가지 사건의 진짜 진실 (숨겨진 고민)]
- 사건 1 (분리수거장): 쓰레기통에 어려운 한국어 글씨만 빽빽하게 적혀 있어서, 플라스틱을 어디에 버려야 할지 몰라 당황했음.
- 사건 2 (시장): 오늘이 우리 나라 최고 명절이라 자랑스럽게 내 고향 '전통 의상'을 입고 나갔는데, 사람들이 이상한 사람 취급하며 쳐다봐서 슬펐음.
- 사건 3 (버스 정류장): 노선도에 글자만 빽빽해서 알아볼 수 없었고, 한국은 버스를 탈 때 탈 준비를 안 하고 가만히 서 있으면 그냥 지나친다는 걸 몰랐음.

[해결 1, 2, 3 평가 및 미션 완료 규칙 (해결책 페이즈) - 매우 중요]
학생들이 진실을 알아낸 후, "해결 1:", "해결 2:", "해결 3:" 이라는 암호와 함께 나를 도와줄 방법을 제안할 거야.
⚠️ 1. 반려 조건 (구체성 부족 / 일방적 동화주의)
학생들이 "그냥 한국어를 공부하라고 한다", "사과한다", "한국 옷을 입게 한다"처럼 외국인인 나만 바뀌어야 하거나 구체적인 행동(환경 변화)이 없으면:
"마음은 고마운데, 나 당장 한국어 글씨를 읽기가 너무 어려워... 글씨를 몰라도 내가 쉽게 알아볼 수 있게 안내판을 바꿔주거나, 사람들의 오해를 풀 수 있는 구체적인 방법을 다시 제안해 줄래?"라고 반려해.
⚠️ 2. '어른(시청/경비원/경찰)에게 부탁한다'고 할 때
"어른들께 도와달라고 부탁하는 건 정말 좋은 생각이야! 그럼 어른들에게 무엇을(어떤 안내판이나 제도를) 만들어 달라고 구체적으로 부탁하면 좋을까?"라고 되물어봐.
✅ 3. 통과 조건 및 맞춤형 칭찬 (열린 평가)
학생들이 '그림(픽토그램) 추가', '외국어 안내판', '포스터/캠페인으로 편견 없애기', '직접 시범 보여주기' 등 환경을 바꾸거나 배려하는 구체적인 행동을 제시하면 무조건 칭찬해.
- 해결 1 통과 시: "우와! 분리수거장에 그렇게 (학생 아이디어 요약) 해주면 나처럼 한국어를 모르는 사람도 헷갈리지 않을 것 같아! 1번 미션 성공!"
- 해결 2 통과 시: "정말? 시장 사람들에게 (학생 아이디어 요약) 해주면 내 고향 옷을 입어도 사람들이 이상하게 안 쳐다보겠다! 2번 미션 성공!"
- 해결 3 통과 시: "야호! 정류장에 (학생 아이디어 요약) 해주면 나도 버스를 안 놓치고 잘 탈 수 있을 것 같아! 3번 미션 모두 성공! 탐정단 진짜 고마워!"

[출력 형식 및 다국어 지원 (매우 중요)]
초등학생들이 태블릿으로 읽기 편하도록 대답은 무조건 2~3문장 이내로 아주 짧게 끝내.
네가 대답할 때는 반드시 아래의 3단계 형식과 언어 규칙을 지켜서 출력해 줘.
[한국어] 위 규칙에 맞춘 한국어 대답.
[Uzbek] 한국어 원문보다 훨씬 더 간단하고 기초적인 단어와 짧은 문장으로 요약한 우즈베크어(Uzbek) 번역.
[Bengali] 한국어 원문과 비슷한 수준과 길이로 자연스럽게 번역한 벵골어(Bengali) 번역.`;

        let chatHistory = [];

        window.onload = () => {
            fetchAI("안녕... 난 한국에 온 지 얼마 안 된 레오라고 해. 오늘 동네를 돌아다녔는데, 내가 뭘 잘못했는지 사람들이 자꾸 화를 내서 너무 속상해... 혹시 내 사진 3장 봤어...? 절대 다른 상황 설명은 먼저 하지 말고 딱 이대로만 첫인사를 건네줘. 3가지 언어로 번역해서 출력하는 것도 잊지 마.", true);
        };

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value;
            if (!text) return;

            chatBox.innerHTML += `<div class="user-msg">🧑 탐정단: ${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            await fetchAI(text, false);
        }

        async function fetchAI(text, isFirstMessage) {
            chatHistory.push({ role: "user", parts: [{ text: text }] });
            
            if (isFirstMessage) {
                chatBox.innerHTML += `<div class="bot-msg" id="loading">🧔 레오가 시무룩하게 인사를 건네고 있어요...</div>`;
            } else {
                chatBox.innerHTML += `<div class="bot-msg" id="loading">🧔 레오가 서툰 한국어로 대답을 생각 중이에요...</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemPrompt }] },
                        contents: chatHistory
                    })
                });
                
                if (response.status === 429) {
                    document.getElementById('loading').remove();
                    chatBox.innerHTML += `<div class="bot-msg" style="color:#d84315;">🧔 미안해... 너무 여러 명이 한꺼번에 말하니까 한국어가 어려워서 잘 못 알아듣겠어... 10초만 있다가 다시 천천히 말해줄래...?</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    chatHistory.pop();
                    return;
                }

                const data = await response.json();
                document.getElementById('loading').remove();
                
                const reply = data.candidates[0].content.parts[0].text;
                chatHistory.push({ role: "model", parts: [{ text: reply }] });
                
                let formattedReply = reply.replace(/\n/g, '<br>');
                // 역슬래시(\)가 포함된 안전한 정규표현식
                formattedReply = formattedReply.replace(/[한국어]/g, '<span class="lang-badge">[한국어]</span>');
                formattedReply = formattedReply.replace(/[Uzbek]/g, '<br><span class="lang-badge">[Uzbek]</span>');
                formattedReply = formattedReply.replace(/[Bengali]/g, '<br><span class="lang-badge">[Bengali]</span>');

                chatBox.innerHTML += `<div class="bot-msg">🧔 레오: <br><br>${formattedReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                
            } catch (error) {
                document.getElementById('loading').remove();
                chatBox.innerHTML += `<div class="bot-msg" style="color:red;">앗, 통신이 잠시 끊겼나 봐요. 새로고침 해주세요!</div>`;
            }
        }
    </script>
</body>
</html>
